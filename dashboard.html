<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LexCounsel Portal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/variables.css">
</head>
<body style="background:var(--surface); display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:var(--font-sans);">
  <div style="text-align:center; padding:40px; background:#fff; border-radius:12px; border:1px solid var(--line); max-width:400px; width:90%; box-shadow:var(--shadow-md);">
    <div style="font-size:36px; margin-bottom:12px;">⚖</div>
    <h2 style="color:var(--navy); margin-bottom:8px;">Opening LexCounsel Portal</h2>
    <p style="color:var(--muted); font-size:14px; margin-bottom:20px;">Routing to your role workspace...</p>
    <div style="display:inline-block; width:24px; height:24px; border:3px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite;"></div>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
    import { auth } from "./js/firebase-config.js";
    import { getCurrentUserProfile, routeForRole } from "./js/auth.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      const profile = await getCurrentUserProfile(true);
      if (profile && profile.role) {
        window.location.href = routeForRole(profile.role);
      } else {
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
