<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092544"/>
      <stop offset="60%" stop-color="#113359"/>
      <stop offset="100%" stop-color="#184373"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c49710"/>
      <stop offset="50%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#e5b824"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c5b8e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#113359" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#officeBg)"/>

  <!-- Modern Law Firm Office Skyline Windows -->
  <g opacity="0.35">
    <rect x="60" y="40" width="190" height="260" fill="url(#windowGlow)" stroke="#ffd966" stroke-width="0.75"/>
    <rect x="300" y="40" width="200" height="260" fill="url(#windowGlow)" stroke="#ffd966" stroke-width="0.75"/>
    <rect x="550" y="40" width="190" height="260" fill="url(#windowGlow)" stroke="#ffd966" stroke-width="0.75"/>

    <!-- Subtle city silhouettes outside -->
    <rect x="90" y="160" width="25" height="140" fill="#0d243c"/>
    <rect x="120" y="120" width="40" height="180" fill="#0b1e33"/>
    <rect x="165" y="180" width="30" height="120" fill="#0e2842"/>
    <rect x="330" y="100" width="50" height="200" fill="#0b1e33"/>
    <rect x="390" y="140" width="35" height="160" fill="#0d243c"/>
    <rect x="430" y="80" width="45" height="220" fill="#0b1e33"/>
    <rect x="580" y="130" width="40" height="170" fill="#0b1e33"/>
    <rect x="630" y="90" width="50" height="210" fill="#0d243c"/>
  </g>

  <!-- Executive Mahogany Conference Desk -->
  <polygon points="120,380 680,380 780,480 20,480" fill="#1b2a3a"/>
  <line x1="120" y1="380" x2="680" y2="380" stroke="url(#goldAcc)" stroke-width="2"/>
  <rect x="250" y="385" width="300" height="8" rx="2" fill="#24384d" opacity="0.8"/>

  <!-- Legal Briefs, Dossier, & Quill Icon on Table -->
  <g transform="translate(400, 310)">
    <!-- Document Stack -->
    <rect x="-90" y="-30" width="70" height="90" rx="3" fill="#f5f7fa" opacity="0.9" transform="rotate(-6 -55 15)"/>
    <rect x="-85" y="-32" width="70" height="90" rx="3" fill="#ffffff" transform="rotate(3 -50 13)"/>
    <!-- Gold Ribbon / Seal -->
    <circle cx="-50" cy="40" r="12" fill="url(#goldAcc)"/>
    <path d="M-55,50 L-50,62 L-45,50" fill="url(#goldAcc)"/>
    
    <!-- Legal Tablet & Gavel Outline -->
    <rect x="20" y="-15" width="80" height="55" rx="5" fill="#0e1f30" stroke="#ffd966" stroke-width="1.5"/>
    <rect x="28" y="-7" width="64" height="39" rx="2" fill="#1a3554"/>
    <circle cx="60" cy="12" r="8" fill="url(#goldAcc)" opacity="0.8"/>
  </g>

  <!-- Crest Overlay -->
  <g text-anchor="middle" font-family="Georgia, serif">
    <text x="400" y="240" fill="#ffffff" font-size="20" font-weight="bold" letter-spacing="3">STRATEGIC LEGAL COUNSEL</text>
    <text x="400" y="268" fill="#ffd966" font-size="12" font-family="-apple-system, sans-serif" font-weight="600" letter-spacing="2">DEDICATED PARTNERSHIP &amp; INTEGRITY</text>
  </g>
</svg>
