<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — LexCounsel Legal Management</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      padding: 24px 16px;
    }
    .auth-card {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 36px 30px;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 24px;
    }
    .auth-brand .scale-icon {
      width: 32px;
      height: 32px;
      background: rgba(184, 134, 11, 0.15);
      color: var(--gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-brand">
      <span class="scale-icon">⚖</span>
      <span>LEXCOUNSEL</span>
    </a>

    <h1 style="font-size:22px; text-align:center; margin-bottom:6px;">Reset Your Password</h1>
    <p class="text-muted text-sm text-center mb-4">Enter your registered email address to receive password reset instructions.</p>

    <div id="reset-msg" class="mb-3 text-center text-sm" style="display:none;"></div>

    <form id="reset-form">
      <div class="form-group">
        <label class="form-label" for="email">Account Email <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:11px;">
        <span>Send Reset Link →</span>
      </button>
    </form>

    <div class="mt-4 pt-3 text-center text-sm text-muted" style="border-top:1px solid var(--line);">
      Remember your password? <a href="login.html" style="color:var(--gold); font-weight:600;">Sign in</a>
    </div>
  </div>

  <div class="toast-container"></div>

  <script type="module">
    import { resetPassword } from "./js/auth.js";
    import { showToast } from "./js/ui.js";

    const form = document.getElementById("reset-form");
    const msgEl = document.getElementById("reset-msg");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Sending...';

      try {
        await resetPassword(email);
        msgEl.innerHTML = '<div style="color:var(--green); font-weight:600; padding:10px; background:var(--green-bg); border-radius:var(--radius);">Password reset instructions sent. Please check your inbox.</div>';
        msgEl.style.display = "block";
        form.reset();
      } catch (err) {
        msgEl.innerHTML = `<div style="color:var(--red); font-weight:600; padding:10px; background:var(--red-bg); border-radius:var(--radius);">${err.message}</div>`;
        msgEl.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "<span>Send Reset Link →</span>";
      }
    });
  </script>
</body>
</html>
