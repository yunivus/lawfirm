<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — LexCounsel</title><link rel="stylesheet" href="styles.css"></head><body><div class="app">
<aside class="sidebar"><a class="brand" href="dashboard.html"><span class="brand-mark">⚖</span>LEXCOUNSEL</a><a class="side-link " href="dashboard.html"><span class="side-icon">▦</span>Dashboard</a><a class="side-link " href="new-case.html"><span class="side-icon">＋</span>New Case</a><a class="side-link " href="cases.html"><span class="side-icon">▤</span>Cases</a><a class="side-link " href="clients.html"><span class="side-icon">♙</span>Clients</a><a class="side-link " href="documents.html"><span class="side-icon">▱</span>Documents</a><a class="side-link active" href="settings.html"><span class="side-icon">⚙</span>Settings</a><div class="side-bottom"><a class="side-link" href="index.html">↩ Sign out</a></div></aside>
<main class="main"><header class="topbar"><button class="menu-toggle">☰</button><div class="search">⌕ &nbsp; Search cases, clients, documents...</div><div class="profile"><span>●</span><span class="avatar">AM</span><span><b>Alex Morgan</b><br><small class="muted">Attorney</small></span></div></header><section class="content"><div class="page-title"><div><h1>Settings</h1><p>Manage your profile, notifications, and security preferences.</p></div></div><div class="grid-2 equal"><div class="panel"><h3>Profile</h3><form data-demo="Profile saved"><div class="row"><div class="field"><label>First name</label><input value="Alex"></div><div class="field"><label>Last name</label><input value="Morgan"></div></div><div class="field"><label>Email</label><input value="alex@example.com"></div><div class="field"><label>Phone</label><input value="+1 (555) 000-0000"></div><button class="btn btn-gold" type="submit">Save changes</button></form></div><div class="panel"><h3>Notifications</h3><div class="list"><label class="list-item"><span><strong>Email notifications</strong><small>Case updates and messages</small></span><input type="checkbox" checked></label><label class="list-item"><span><strong>Deadline reminders</strong><small>Receive upcoming deadline alerts</small></span><input type="checkbox" checked></label><label class="list-item"><span><strong>Marketing emails</strong><small>Occasional product news</small></span><input type="checkbox"></label></div><h3 style="margin-top:22px">Security</h3><button class="btn btn-outline" data-toast="Password change opened">Change password</button></div></div></section></main></div><script src="script.js"></script></body></html>
